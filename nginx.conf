upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Allow large file uploads (passed through Next.js /api proxy to xinren-rag)
    client_max_body_size 10M;

    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;

        # WebSocket support (Next.js HMR + LangServe streaming via /api proxy)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Long timeouts: lazy retriever init on first request can take minutes
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

upstream qa_generator {
    server qa-generator:3000;
}

server {
    listen 8082;
    server_name _;

    # Document uploads (the app itself rejects files over 10 MB)
    client_max_body_size 10M;

    location / {
        proxy_pass         http://qa_generator;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Progress is streamed while the LLM works; don't hold it back
        proxy_buffering off;

        # Generation of a long document can take several minutes
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
